name: Riyadh Real Estate Analysis Only

on:
  workflow_dispatch:

jobs:
  analyze-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify raw listings are available
        run: |
          if [ ! -s riyadh_raw_listings.csv ]; then
            echo "::error::riyadh_raw_listings.csv is missing. Run the Weekly Real Estate Scraper & Analyzer workflow first; this workflow only analyzes an existing raw dataset."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run General Analysis
        run: python clean_and_analyze.py

      - name: Run Apartment Analysis
        run: python clean_and_analyze_apartments.py

      - name: Commit and push charts and updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add riyadh_cleaned_listings.csv riyadh_district_price_analysis.csv riyadh_cleaned_apartments.csv riyadh_district_apartment_analysis.csv *.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Auto-update analysis metrics and charts [skip ci]"
          git push
