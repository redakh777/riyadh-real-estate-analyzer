name: Riyadh Real Estate Pipeline Scheduler

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Web Scraper
        run: python scrape_riyadh_full.py

      - name: Run Analysis Pipelines
        run: |
          python clean_and_analyze.py
          python clean_and_analyze_apartments.py

      - name: Commit and push updated data/charts back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add riyadh_raw_listings.csv riyadh_cleaned_listings.csv riyadh_cleaned_apartments.csv riyadh_district_price_analysis.csv riyadh_district_apartment_analysis.csv *.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Scraped and analyzed fresh real estate data" && git push)
